---
name: build-and-test
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '8', '17' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          java-package: jdk
          cache: gradle

      # for gradle build
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          java-package: jdk
          cache: gradle

      - name: Build with Gradle
        shell: bash
        run: |
          ./gradlew build -Pjava_version=${{ matrix.java-version }}
      - run: mkdir staging && cp build/libs/*.jar staging
      - run: echo "NOW=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_ENV
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uberbukkit-${{ env.NOW }}-java${{ matrix.java-version }}
          path: staging
